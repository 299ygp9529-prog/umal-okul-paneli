<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMAL Okul Paneli</title>
<meta name="theme-color" content="#0d1726">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="simge-192.png">
<link rel="apple-touch-icon" href="simge-192.png">

</head>
<body>
<div id="giris" class="giris gizli"><i class="isik bir"></i><i class="isik iki"></i>
  <div class="kutu">
    <div class="logo-cerceve"><i class="halka"></i><i class="halka iki"></i><img src="okul-logo.png" alt="Ümraniye Merkez Anadolu Lisesi"></div>
    <div class="atlas" aria-label="Atlas"><span>A</span><span>T</span><span>L</span><span>A</span><span>S</span></div>
    <div class="baslik">Okul Yönetim Paneli</div>
    <div class="alt">Ümraniye Merkez Anadolu Lisesi</div>
    <div id="adim1">
      <label for="eposta">E-posta adresiniz</label>
      <input id="eposta" type="email" autocomplete="email" placeholder="ornek@okul.k12.tr">
      <button id="kodGonder" class="birincil">Kod gönder</button>
    </div>
    <div id="adim2" class="gizli">
      <label for="kod">E-postanıza gelen kod</label>
      <input id="kod" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Kod">
      <label class="hatirla"><input type="checkbox" id="hatirla" checked><span class="kutucuk"></span>Bu cihazda beni hatırla<small>Bir daha kod sorulmaz. Ortak bilgisayarda işareti kaldırın.</small></label>
      <button id="girisYap" class="birincil">Giriş</button>
      <button id="geri" class="ikincil">Başka e-posta</button>
    </div>
    <div id="girisBilgi" class="bilgi"></div>
    <button id="yukleGiris" class="ikincil yukle gizli">Bilgisayara simge olarak ekle</button>
    <a class="kurlink" href="kur.html">Telefona ya da bilgisayara simge ekle →</a>
    <div class="not">Şifre yok · Kod e-postanıza gelir · Yalnız okul yönetiminin eklediği kişiler girebilir</div>
  </div>
</div>

<div id="uygulama" class="uygulama gizli">
  <nav class="yan">
    <div class="logo3d" title="Ümraniye Merkez Anadolu Lisesi"><div class="para"><i style="transform:translateZ(-4px)"></i><i style="transform:translateZ(-3px)"></i><i style="transform:translateZ(-2px)"></i><i style="transform:translateZ(-1px)"></i><i style="transform:translateZ(0px)"></i><i style="transform:translateZ(1px)"></i><i style="transform:translateZ(2px)"></i><i style="transform:translateZ(3px)"></i><img class="yuz on" src="okul-logo.png" alt="Ümraniye Merkez Anadolu Lisesi"><img class="yuz arka" src="okul-logo.png" alt=""></div></div>
    <div class="ust-ad">Atlas<small>Okul Yönetim Paneli</small></div>
    <div id="menu"></div>
    <div class="kullanici"><span id="kim"></span><span id="rolEtiket" class="etiket"></span><button id="yukle" class="bag gizli">Masaüstüne ekle</button><button id="cikis" class="bag">Çıkış</button></div>
  </nav>
  <main id="icerik"></main>
</div>

<div id="pencere" class="pencere gizli"><div class="pencere-ic"><button class="kapat" id="pencereKapat" aria-label="Kapat">✕</button><div id="pencereIcerik"></div></div></div>
<div id="yazdir" class="yazdir"></div>
<script src="zip.js?v=202611072100"></script>
<script src="uygulama.js?v=202611072100"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
