name: kitaplik
on:
  push:
    paths: ['.github/workflows/kitaplik.yml']
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o supabase.min.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js
          test $(stat -c %s supabase.min.js) -gt 50000
          git config user.name "umal-bot"; git config user.email "umal-bot@users.noreply.github.com"
          git add supabase.min.js && git commit -m "Panel kitaplığı yerel kopya (supabase-js 2.45.4)" && git push || true
