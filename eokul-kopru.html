<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-Okul'a aktar · Atlas</title>
<link rel="stylesheet" href="stil.css?v=20261122054024">
<script src="supabase.min.js?v=2.45.4"></script>
<style>
  body { background: var(--zemin); margin: 0; }
  .ek { max-width: 880px; margin: 0 auto; padding: 18px 16px 40px; }
  .ek h1 { font-size: 21px; margin: 0 0 2px; } .ek-alt { color: var(--soluk); font-size: 13px; margin-bottom: 14px; }
  .ek-kayit { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--cizgi); background: var(--koyu); color: var(--yazi); cursor: pointer; font: inherit; margin-bottom: 6px; }
  .ek-kayit.secili { border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon) inset; }
  .ek-kayit b { display: block; } .ek-kayit small { color: var(--soluk); } .ek-kayit .ek-o { margin-left: auto; color: var(--neon); font-weight: 800; white-space: nowrap; }
  .ek-tablo { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 5px; margin-top: 8px; }
  .ek-s { display: grid; grid-template-columns: 50px minmax(0, 1fr) 40px 64px; gap: 6px; align-items: center; padding: 6px 9px; border-radius: 10px; background: var(--koyu); border: 1px solid var(--cizgi); font-size: 13.5px; }
  .ek-s .no { color: var(--neon); font-weight: 800; } .ek-s .ad { overflow-wrap: break-word; line-height: 1.2; } .ek-s .v { text-align: center; font-weight: 800; } .ek-s .e { text-align: right; color: var(--soluk); font-size: 12px; white-space: nowrap; }
  .ek-s.degisir { border-color: rgba(245,158,11,.7); } .ek-s.yok { opacity: .55; }
  .ek-bas { display: grid; grid-template-columns: 54px minmax(0, 1fr) 52px 52px; gap: 6px; font-size: 11.5px; font-weight: 800; color: var(--soluk); padding: 0 9px; }
  .ek-cubuk { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin: 12px 0 6px; } .ek-cubuk i { display: block; height: 100%; width: 0; background: var(--neon); transition: width .3s; }
  .ek-son { display: flex; align-items: flex-start; gap: 12px; } .ek-son svg { flex: none; width: 34px; height: 34px; }
</style>
</head>
<body>
<div class="ek" id="ek"><div class="kart soluk">Atlas açılıyor…</div></div>
<script>
(function () {
  'use strict';
  const EOKUL = 'https://e-okul.meb.gov.tr';
  const sb = window.supabase.createClient('https://ceqdghykweubeaokwadt.supabase.co', 'sb_publishable_YCctPAToPYgrvfeieRumPw_4SNsfaEZ', { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sb-ceqdghykweubeaokwadt-auth-token',
    storage: { getItem: k => { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } }, setItem: (k, v) => { try { (sessionStorage.getItem(k) ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} }, removeItem: () => {} } } });
  const $ = s => document.querySelector(s), E = $('#ek');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tr = 'tr-TR', nrm = s => String(s || '').toLocaleLowerCase(tr).replace(/[^a-z0-9çğıöşü]/g, '');
  const bas = s => String(s || '').toLocaleLowerCase(tr).replace(/(^|[\s(/-])(\S)/g, (m, a, b) => a + b.toLocaleUpperCase(tr));
  const TIK = '<svg viewBox="0 0 24 24" fill="none" stroke="#3ef08a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.3 3 3 6-6.3"/></svg>';
  const UNL = '<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>';
  const S = { baglam: null, kayitlar: [], sec: null, kolon: null };
  const gonder = o => { try { window.opener.postMessage(Object.assign({ atlas: 1 }, o), EOKUL); } catch (e) {} };
  const hata = m => { E.innerHTML = `<h1>e-Okul'a aktar</h1><div class="kart ek-son">${UNL}<div>${m}</div></div>`; };

  const goster = v => v == null || v === '' ? '' : String(v).replace('.', ',');
  const katAtlas = v => { const t = String(v == null ? '' : v).trim().toUpperCase(); return t === 'G' || t === 'GM' || t === 'M' || t === 'MZ' ? 'G' : t === 'K' ? 'K' : null; };
  const sayi = v => { if (v == null || v === '') return null; const x = +String(v).replace(',', '.'); return isFinite(x) ? x : NaN; };
  // Atlas kaydından bir öğrencinin e-Okul'a gidecek hâli: {katilim:'G'|'K'|'girdi', puan:[...], toplam} ya da {sorun}
  function hedef(K, no, Q) {
    const n = (K.notlar || {})[no]; if (n == null || String(n).trim() === '') return null;
    const kt = katAtlas(n); if (kt) return { katilim: kt, puan: [], toplam: kt };
    const s = (K.soru || {})[no];
    if (!Array.isArray(s)) return { sorun: 'soru puanı yok', toplam: goster(n) };
    if (s.length !== Q) return { sorun: `Atlas'ta ${s.length} soru, e-Okul'da ${Q}`, toplam: goster(n) };
    const P = s.map(v => v == null ? 0 : sayi(v));
    if (P.some(v => isNaN(v) || !Number.isInteger(v))) return { sorun: 'buçuklu soru puanı', toplam: goster(n) };
    return { katilim: 'girdi', puan: P, toplam: String(P.reduce((a, b) => a + b, 0)) };
  }
  const eToplam = e => e.katilim === 'G' || e.katilim === 'K' ? e.katilim : e.katilim === 'girdi' ? (e.puan.some(p => p === '') ? '…' : String(e.puan.reduce((a, b) => a + +b, 0))) : '';
  const esit = (h, e) => h.katilim === 'G' || h.katilim === 'K' ? e.katilim === h.katilim : e.katilim === 'girdi' && e.puan.length === h.puan.length && e.puan.every((p, j) => p !== '' && +p === h.puan[j]);

  // ---- Klasik Ders Notu Girişi (12. sınıflar vb.): toplam not, tek seferde; Kaydet ve güvenlik kodu öğretmende ----
  const klasikDeger = v => { const t = String(v == null ? '' : v).trim().toUpperCase().replace(',', '.'); if (t === 'K') return 'K'; if (t === 'G' || t === 'GM' || t === 'M' || t === 'MZ') return 'G'; if (/^\d{1,3}(\.\d+)?$/.test(t) && +t <= 100) return String(Math.round(+t)); return null; };
  function cizKlasik() {
    const B = S.baglam, K = S.sec;
    if (!S.kayitlar.length) return hata(`Bu sınıfın öğrencileri için Atlas'ta yüklenmiş not bulunamadı.<br><span class="soluk kucuk">Önce Atlas › Not Yükle'den notları yükleyin.</span>`);
    if (S.kolon == null) { const n = (String(K.sinav).match(/(\d)\.\s*Yazılı/i) || [])[1]; const k = B.kolonlar.find(k => n && new RegExp('^' + n + '\\.?\\s*Sınav', 'i').test(k.ad)); S.kolon = k ? k.i : (B.kolonlar.find(k => k.acik) || {}).i; }
    const kol = B.kolonlar.find(k => k.i === S.kolon);
    let yaz = {}, nYaz = 0, nAyni = 0, nDeg = 0, nYok = 0;
    const satirlar = B.ogrenciler.map(o => { const ham = (K.notlar || {})[o.no], a = klasikDeger(ham), e = (o.deger || {})[S.kolon] || ''; let c = '';
      if (a == null) { nYok++; c = 'yok'; }
      else if (e !== '' && (String(e).toUpperCase() === a || (!isNaN(+e) && !isNaN(+a) && +e === +a))) nAyni++;
      else { nYaz++; if (e !== '') { nDeg++; c = 'degisir'; } yaz[o.no] = a; }
      return `<div class="ek-s ${c}"><span class="no">${esc(o.no)}</span><span class="ad">${esc(bas(o.ad))}</span><span class="v">${esc(ham == null ? '' : goster(ham))}</span><span class="e">${e !== '' ? 'e-Okul ' + esc(e) : ''}</span></div>`; }).join('');
    S.klasikYaz = yaz;
    E.innerHTML = `<h1>e-Okul'a aktar</h1><div class="ek-alt">${esc(B.baslik || '')} · ${B.ogrenciler.length} öğrenci</div>
      <div class="kart"><div class="nt-alan"><span>Atlas'taki not</span>${S.kayitlar.map((k, i) => `<button class="ek-kayit ${K === k ? 'secili' : ''}" data-k="${i}"><div><b>${esc(k.sinif)} · ${esc(k.ders)}</b><small>${esc(k.sinav)} · ${esc(new Date(k.guncel).toLocaleDateString(tr, { day: 'numeric', month: 'long' }))}</small></div><span class="ek-o">${k.ortak} öğrenci</span></button>`).join('')}</div>
        <div class="nt-alan" style="margin-top:12px"><span>e-Okul'da hangi sütuna?</span><div class="cipler">${B.kolonlar.map(k => `<button class="cip ${S.kolon === k.i ? 'secili' : ''}" data-c="${k.i}">${esc(k.ad)}${k.acik ? '' : ' (kapalı)'}</button>`).join('')}</div></div></div>
      <div class="kart"><div class="soluk kucuk">Kalın rakam Atlas'taki not; yanında e-Okul'da şu an yazan (varsa).</div><div class="ek-tablo">${satirlar}</div>
        <p class="kucuk" style="margin:12px 0 0">${nAyni ? `<span class="yeşil">${nAyni} öğrencinin notu e-Okul ile aynı.</span> ` : ''}${nYaz ? `${nYaz} öğrencinin notu e-Okul sayfasına yazılacak.` : ''}${nDeg ? ` <span class="turuncu">Turuncu ${nDeg} öğrencinin e-Okul'da farklı notu var; Atlas'takiyle değişecek.</span>` : ''}${nYok ? ` <span class="soluk">${nYok} öğrencinin Atlas'ta notu yok.</span>` : ''}</p>
        ${kol && !kol.acik ? `<div class="kart ek-son" style="margin:12px 0 0">${UNL}<div class="kucuk">e-Okul'da <b>${esc(kol.ad)}</b> sütunu şu an not girişine kapalı (kutular gri). e-Okul'da güvenlik kodunu yazıp Listele'ye basın; kutular açılınca düğmeye yeniden basın.</div></div>`
          : `<div class="dugmeler" style="margin-top:12px"><button class="birincil" id="ekDoldur" ${nYaz ? '' : 'disabled'}>${nYaz ? `${nYaz} notu e-Okul sayfasına yaz` : 'e-Okul zaten Atlas ile aynı'}</button></div>`}</div>`;
    E.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { S.sec = S.kayitlar[+b.dataset.k]; S.kolon = null; ciz(); });
    E.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.kolon = +b.dataset.c; ciz(); });
    const y = $('#ekDoldur'); if (y) y.onclick = () => { y.disabled = true; gonder({ tip: 'doldur', kolon: S.kolon, notlar: S.klasikYaz }); };
  }
  function ciz() {
    if (S.baglam && S.baglam.ekran === 'klasik') return cizKlasik();
    const B = S.baglam, K = S.sec, Q = B.sorular.length;
    if (!S.kayitlar.length) return hata(`Bu sınıfın öğrencileri için Atlas'ta yüklenmiş not bulunamadı.<br><span class="soluk kucuk">Önce Atlas › Not Yükle'den soru puan kâğıdının fotoğrafını çekip kaydedin.</span>`);
    const maxA = (K.soru_puan || []).map(v => v == null ? null : +v), maxE = B.sorular.map(s => s.max);
    const maxUyum = !K.soru_puan || (maxA.length === Q && maxA.every((v, i) => v == null || v === maxE[i]));
    const soruVar = Object.keys(K.soru || {}).length > 0;
    let yaz = {}, nYaz = 0, nDeg = 0, nAyni = 0, nSorun = 0, nYok = 0, nFark = 0;
    const satirlar = B.ogrenciler.map(o => { const h = hedef(K, o.no, Q), et = eToplam(o); let c = '', not = '';
      if (!h) { nYok++; c = 'yok'; }
      else if (h.sorun === 'soru puanı yok') { if (String(h.toplam).replace(',', '.') === String(et)) nAyni++; else { nFark++; c = 'degisir'; not = 'toplam farklı'; } }
      else if (h.sorun) { nSorun++; c = 'degisir'; not = h.sorun; }
      else if (esit(h, o)) { nAyni++; }
      else { nYaz++; if (o.katilim) nDeg++; c = o.katilim ? 'degisir' : ''; yaz[o.no] = { katilim: h.katilim, puan: h.puan }; }
      return `<div class="ek-s ${c}" ${not ? `title="${esc(not)}"` : ''}><span class="no">${esc(o.no)}</span><span class="ad">${esc(bas(o.ad))}</span><span class="v">${esc(h ? h.toplam : '')}</span><span class="e">${et ? 'e-Okul ' + esc(et) : ''}</span></div>`; }).join('');
    const engel = !soruVar ? `Bu Atlas kaydı yalnız toplam notu tutuyor (PDF ya da elle girilmiş). e-Okul'un OYSS ekranı soru soru puan istediği için bu kayıtla yalnız karşılaştırma yapılır; e-Okul'a yazmak için notları soru puan kâğıdının fotoğrafıyla yükleyin.`
      : !maxUyum ? `Soruların en yüksek puanları tutmuyor — Atlas: ${maxA.map(goster).join(', ')} · e-Okul: ${maxE.join(', ')}. Yanlış sınav ya da yanlış ders seçilmiş olabilir; yazma kapalı.` : '';
    E.innerHTML = `<h1>e-Okul'a aktar</h1><div class="ek-alt">${esc(B.baslik || '')} · ${B.ogrenciler.length} öğrenci · ${Q} soru</div>
      <div class="kart"><div class="nt-alan"><span>Atlas'taki not</span>${S.kayitlar.map((k, i) => `<button class="ek-kayit ${K === k ? 'secili' : ''}" data-k="${i}"><div><b>${esc(k.sinif)} · ${esc(k.ders)}</b><small>${esc(k.sinav)} · ${esc(new Date(k.guncel).toLocaleDateString(tr, { day: 'numeric', month: 'long' }))} · ${Object.keys(k.soru || {}).length ? 'soru puanlı' : 'yalnız toplam'}</small></div><span class="ek-o">${k.ortak} öğrenci</span></button>`).join('')}</div></div>
      <div class="kart"><div class="soluk kucuk">Kalın rakam Atlas'taki toplam; yanında e-Okul'da şu an yazan toplam (varsa).</div><div class="ek-tablo">${satirlar}</div>
        <p class="kucuk" style="margin:12px 0 0">${nAyni ? `<span class="yeşil">${nAyni} öğrencinin ${soruVar ? 'notu' : 'toplamı'} e-Okul ile aynı.</span> ` : ''}${nFark ? `<span class="turuncu">${nFark} öğrencinin toplamı e-Okul'dakinden farklı (turuncu).</span> ` : ''}${engel ? '' : (nYaz ? `${nYaz} öğrencinin notu e-Okul'a yazılacak.` : '')}${!engel && nDeg ? ` <span class="turuncu">Turuncu ${nDeg} öğrencinin e-Okul'da farklı notu var; Atlas'takiyle değişecek.</span>` : ''}${engel && nYaz ? ` <span class="turuncu">${nYaz} öğrencide fark var (turuncu).</span>` : ''}${nSorun ? ` <span class="turuncu">${nSorun} öğrenci yazılamaz (üzerine gelince nedeni görünür).</span>` : ''}${nYok ? ` <span class="soluk">${nYok} öğrencinin Atlas'ta notu yok; e-Okul'da olduğu gibi kalır.</span>` : ''}</p>
        ${engel ? `<div class="kart ek-son" style="margin:12px 0 0">${UNL}<div class="kucuk">${engel}</div></div>` : `<div class="dugmeler" style="margin-top:12px"><button class="birincil" id="ekYaz" ${nYaz ? '' : 'disabled'}>${nYaz ? `${nYaz} öğrenciyi e-Okul'a yaz` : 'e-Okul zaten Atlas ile aynı'}</button></div>`}</div>`;
    E.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { S.sec = S.kayitlar[+b.dataset.k]; ciz(); });
    const y = $('#ekYaz'); if (y) y.onclick = () => {
      E.innerHTML = `<h1>e-Okul'a aktar</h1><div class="ek-alt">${esc(B.baslik || '')}</div><div class="kart"><b id="ekDurum">e-Okul'a kaydediliyor…</b><div class="ek-cubuk"><i id="ekCubuk"></i></div><div class="soluk kucuk">Bu pencereyi ve e-Okul sayfasını kapatmayın. e-Okul notları 5'erli gruplar hâlinde kaydeder; her grupta EBA'ya da gönderir.</div></div>`;
      S.yazilan = yaz; gonder({ tip: 'yaz', veri: yaz });
    };
  }
  async function baglamGeldi(B) {
    S.baglam = B; E.innerHTML = '<div class="kart soluk">Atlas\'taki notlar aranıyor…</div>';
    const { data: u } = await sb.auth.getSession();
    if (!u || !u.session) return hata(`Bu tarayıcıda Atlas oturumu açık değil.<br><span class="soluk kucuk">Aynı tarayıcıda <a href="https://umalatlas.com.tr" target="_blank" style="color:var(--neon)">umalatlas.com.tr</a> adresinden giriş yapın, sonra e-Okul'da düğmeye yeniden basın.</span>`);
    const nolar = new Set(B.ogrenciler.map(o => String(o.no)));
    const { data, error } = await sb.from('umal_not').select('id,sinif,ders,sinav,notlar,soru,soru_puan,guncel,kaynak').order('guncel', { ascending: false }).limit(400);
    if (error) return hata('Atlas\'taki notlar okunamadı: ' + esc(error.message));
    S.kayitlar = (data || []).map(k => Object.assign(k, { ortak: Object.keys(k.notlar || {}).filter(n => nolar.has(n) && String(k.notlar[n]).trim()).length }))
      .filter(k => k.ortak >= Math.max(1, Math.min(5, nolar.size * .3)));
    const bd = nrm(B.baslik), sn = (String(B.baslik).match(/(\d)\.\s*Dönem\s*(\d)\./i) || []);
    const puan = k => (bd.includes(nrm(k.ders)) ? 4 : 0) + (sn[1] && new RegExp(sn[1] + '\\.\\s*Dönem\\s*' + sn[2] + '\\.', 'i').test(k.sinav) ? 2 : 0) + (Object.keys(k.soru || {}).length ? 1 : 0);
    S.kayitlar.sort((a, b) => puan(b) - puan(a) || b.ortak - a.ortak || new Date(b.guncel) - new Date(a.guncel));
    if (S.kayitlar.length) S.sec = S.kayitlar[0];
    ciz();
  }
  window.addEventListener('message', ev => {
    if (ev.origin !== EOKUL || !ev.data || !ev.data.atlas) return; const d = ev.data;
    if (d.tip === 'baglam') baglamGeldi(d);
    else if (d.tip === 'ilerleme') { const a = $('#ekDurum'), c = $('#ekCubuk'); if (a) a.textContent = d.m; if (c) c.style.width = Math.round(d.oran * 100) + '%'; }
    else if (d.tip === 'doldurdu') { const r = d.sonuc || {};
      E.innerHTML = `<h1>e-Okul'a aktar</h1><div class="kart ek-son">${r.dolan ? TIK : UNL}<div><b>${r.dolan ? `${r.dolan} öğrencinin notu e-Okul sayfasına yazıldı.` : 'Hiçbir kutuya yazılamadı.'}</b>
        <div class="kucuk" style="margin-top:6px">${r.dolan ? `Şimdi e-Okul sayfasına dönün: yeşil kutulardaki notlara bir göz atın, ${r.kodVar ? '<b>güvenlik kodunu</b> yazın ve ' : ''}<b>Kaydet</b>'e basın. Kayıttan sonra düğmeye yeniden basarsanız Atlas ile karşılaştırılır.` : ''}${r.kapali ? ` <span class="turuncu">${r.kapali} kutu kapalı olduğu için yazılamadı.</span>` : ''}</div></div></div>
        <div class="dugmeler"><button class="ikincil" onclick="window.close()">Pencereyi kapat</button></div>`; }
    else if (d.tip === 'bitti') {
      const r = d.sonuc || {}, F = r.farkli || [], iyi = !r.hata && !F.length, ad = no => (S.baglam.ogrenciler.find(o => o.no === no) || {}).ad || '';
      E.innerHTML = `<h1>e-Okul'a aktar</h1><div class="kart ek-son">${iyi ? TIK : UNL}<div><b>${iyi ? `${r.yazilan} öğrencinin notu e-Okul'a kaydedildi.` : (r.hata ? 'Kaydetme tamamlanamadı.' : 'Bazı notlar e-Okul\'da farklı görünüyor.')}</b>
        <div class="soluk kucuk" style="margin-top:4px">${iyi ? 'Kayıttan sonra e-Okul\'daki notlar yeniden okunup Atlas ile tek tek karşılaştırıldı; hepsi aynı.' : esc(r.hata || '')}${r.hata && r.yazilan ? ` Bu ana kadar ${r.yazilan} öğrenci kaydedildi.` : ''}</div>
        ${F.length ? `<div class="kucuk" style="margin-top:8px">${F.map(f => `${esc(f.no)} ${esc(bas(ad(f.no)))}`).join('<br>')}</div>` : ''}
        ${!iyi ? '<div class="soluk kucuk" style="margin-top:6px">e-Okul\'da düğmeye yeniden basarsanız yalnız eksik kalanlar yazılır.</div>' : ''}</div></div>
        <div class="dugmeler"><button class="ikincil" onclick="window.close()">Pencereyi kapat</button></div>`;
    }
  });
  if (!window.opener) { hata('Bu sayfa e-Okul not girişi ekranındaki <b>Atlas\'tan aktar</b> düğmesiyle açılır.<br><span class="soluk kucuk"><a href="eokul-kur.html" style="color:var(--neon)">Düğmeyi nasıl kurarım?</a></span>'); return; }
  gonder({ tip: 'hazir' });
})();
</script>
</body>
</html>
