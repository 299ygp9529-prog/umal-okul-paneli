  return `<article class="gun ${bu?'bugun':''} ${gec?'gecti':''}"><div class="gbas"><div class="takv"><i>${t.ay.slice(0,3).toLocaleUpperCase('tr')}</i><b>${t.g}</b></div><div class="gad">${t.gun}<small>${t.g} ${t.ay} ${g.tarih.slice(0,4)}</small></div>${bu?'<span class="etiket b">Bugün</span>':gec?'<span class="etiket g">Yapıldı</span>':''}</div>
  ${g.slot.map(o=>{const sa=z[o.ders]||['',''];const yer=String(o.yer||'').split(',').map(x=>x.trim()).filter(Boolean);
   const sev=[9,10,11,12].map(k=>{const P=parca(o['s'+k]);if(!P.length)return'';
    return `<div class="sev"><span class="no" style="background:${RENK[k]}">${k}.</span><div>${P.map(p=>{const benim=s&&p.sn.includes(s);if(benim)kendi.push({t,o,sa,p,yer});
      return `<p class="ders ${benim?'secili':''} ${s&&!benim?'soluk':''}"><b>${esc(p.ad)}</b><span class="sn">${p.sn.map(x=>`<span class="${x===s?'secili':''}">${esc(x)}</span>`).join('')}</span></p>`}).join('')}</div></div>`}).join('');
   return `<div class="oturum"><div class="saat"><b>${o.ders}. ders</b><span>${sa[0]} – ${sa[1]}</span><span class="yerb">Sınav yeri</span><div class="yer">${yer.map(x=>`<em>${esc(x)}</em>`).join('')}</div></div><div class="dersler">${sev||'<span class="bos">Sınav yok</span>'}</div></div>`}).join('')}</article>`}).join('');
 const so=document.getElementById('sonuc');
 if(s){so.style.display='block';so.innerHTML=`<h3>${esc(s)} için telafi sınavları (${kendi.length})</h3>`+(kendi.length?`<ul>${kendi.map(k=>`<li><b>${k.t.g} ${k.t.ay} ${k.t.gun}</b>, ${k.o.ders}. ders (${k.sa[0]}): ${esc(k.p.ad)} · ${esc(k.yer.join(', '))}</li>`).join('')}</ul>`:'<p>Bu sınıf için telafi sınavı yok.</p>');document.getElementById('fnot').textContent='Diğer sınıfların sınavları soluk gösteriliyor.'}
 else{so.style.display='none';document.getElementById('fnot').textContent='Sınıfını seç; yalnız senin sınavların öne çıksın.'}}
sel.onchange=ciz;ciz();
</script></body></html>
